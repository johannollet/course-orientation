<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b5e3f">
<title>Course d'orientation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f1; --card:#fff; --ink:#1d2a22; --mute:#66756b; --line:#dde3dc;
  --green:#1b5e3f; --green2:#2e8b5e; --orange:#ee7a1a; --red:#d23c3c; --ok:#1f9d55; --gold:#e8a916;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 16px 4px}
.logo{width:30px;height:30px;flex:none}
.hbar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
nav{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:rgba(255,255,255,.75);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{color:#fff;border-bottom-color:var(--orange)}
main{max-width:1200px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:20px}
h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sub{color:var(--mute);font-size:14px;margin:0 0 10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{color:var(--red);border-color:#f0c9c9}
.btn.ghost{background:transparent}
.btn.big{padding:14px 16px;font-size:17px;width:100%}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;flex:1 1 140px}
.seg button b{display:block}
.seg button small{color:var(--mute)}
.seg button.on{border-color:var(--green);background:#e8f3ec}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=number],input[type=password],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:120px}
.st{color:var(--gold);letter-spacing:1px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:#eef2ee;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:baseline;gap:8px}
.ghead b{font-size:17px;flex:1}
.pts{font-weight:800;color:var(--green);font-size:18px;white-space:nowrap}
.members{color:var(--mute);font-size:14px}
.cur{background:#fff6ec;border:1px dashed var(--orange);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cur .num{font-size:22px;font-weight:800}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--orange)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.dot.ok{background:var(--ok)} .dot.ko{background:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar h2{margin:0;flex:1}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-size:13px;color:var(--mute);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rank{font-weight:800;width:40px}
tr.p1 .rank{color:var(--gold)} tr.p2 .rank{color:#8a9aa6} tr.p3 .rank{color:#b8743a}
.tablewrap{overflow-x:auto}
/* modal */
#ov{position:fixed;inset:0;background:rgba(10,25,15,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:16px;overflow-y:auto}
#ov.on{display:flex}
#md{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;margin:auto 0;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.codeform{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.cbox{width:58px!important;height:62px;text-align:center;font-size:28px!important;font-weight:800;border:2px solid var(--line)!important;border-radius:12px!important;padding:0!important}
.cbox.letter{background:#fff6ec!important;border-color:#f6c89c!important;text-transform:uppercase}
.cbox:focus{outline:none;border-color:var(--green)!important;box-shadow:0 0 0 3px rgba(46,139,94,.25)}
.cbox.bad{border-color:var(--red)!important;background:#fdeaea!important}
.cgroup{display:flex;flex-direction:column;align-items:center;gap:3px}
.cgroup small{color:var(--mute);font-size:11px;font-weight:700;text-transform:uppercase}
.sep{flex-basis:100%;height:0}
.result{text-align:center;padding:10px 0}
.result .ic{font-size:64px;line-height:1}
.result h2{font-size:26px;margin:8px 0}
.result.ok h2{color:var(--ok)} .result.ko h2{color:var(--red)}
.starpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.starpick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;cursor:pointer;font-size:18px}
.starpick button.on{border-color:var(--orange);background:#fff6ec}
.bignum{font-size:56px;font-weight:900;text-align:center;color:var(--green);line-height:1.1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#1d2a22;color:#fff;padding:12px 18px;border-radius:12px;transition:.25s;z-index:60;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
.duel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.dhead b{flex:1}
.score{font-weight:900;font-size:18px;background:var(--green);color:#fff;padding:2px 10px;border-radius:8px}
.sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.side{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--c)}
.side.win{border-color:var(--gold);background:#fffaf0}
.vs{align-self:center;font-weight:900;color:var(--orange)}
.minis{display:flex;gap:4px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip.off{opacity:.4;text-decoration:line-through}
.gedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gbox{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px;background:#fff}
.gbox .mem{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:14px}
.gbox select{width:auto;padding:3px 6px;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.info{background:#eef5f0;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.warn{background:#fff3e2;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.lvlmat td,.lvlmat th{text-align:center;padding:4px}
body.fs header{display:none}
body.fs main{max-width:none}
body.fs td,body.fs th{font-size:22px;padding:12px}
@media (max-width:560px){
  main{padding:12px}
  .cbox{width:44px!important;height:54px;font-size:22px!important}
  .codeform{gap:6px}
  .sides{grid-template-columns:1fr}
  .vs{justify-self:center}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <svg class="logo" viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="3" fill="#fff"/><path d="M4 4 L28 28 L4 28Z" fill="#ee7a1a"/></svg>
    <h1 id="htitle">Course d'orientation</h1>
    <button class="lockbtn" id="lockbtn" onclick="toggleLock()"></button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="ov" onclick="if(event.target===this&&!modalSticky)closeModal()"><div id="md"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ utilitaires ============ */
const LS='courseOrientation_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starsH=n=>'<span class="st">'+'★'.repeat(Math.max(0,n|0))+'</span>';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtT=ms=>{if(ms==null)return'';const s=Math.max(0,Math.round(ms/1000));return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const COLORS=['#2e8b5e','#ee7a1a','#3b6fd8','#c2408f','#8b5cf6','#0f9aa8','#d2a106','#d23c3c','#5b7a2e','#a0522d','#1b3a6b','#7a7a7a'];

function defState(){return{
  cards:[],importInfo:null,
  classes:[],classId:null,
  settings:{ptsMode:'stars',showErrors:'count',defiBonus:3,defiLosePts:true,levelSource:'prof',pin:'2335'},
  session:null
}}
let S;
try{S=JSON.parse(localStorage.getItem(LS))||defState()}catch(e){S=defState()}
S=Object.assign(defState(),S);S.settings=Object.assign(defState().settings,S.settings);if(!S.settings.pin)S.settings.pin='2335';
if(S.cards.some(c=>'stars' in c)){const m=new Map();S.cards.forEach(c=>{if(!m.has(String(c.carte))){const{stars,...r}=c;m.set(String(c.carte),r)}});S.cards=[...m.values()]}
if(S.session)S.session.groups.forEach(g=>g.done=[...new Set((g.done||[]).map(k=>String(k).split('|')[0]))]);
/* points cumulés : base de l'élève + ses points de chaque séance, recalculés à chaque validation */
function sessPtsOf(sess){const m={};(sess.groups||[]).forEach(g=>(g.hist||[]).forEach(h=>(h.members||[]).forEach(id=>{m[id]=(m[id]||0)+(h.pts||0)})));return m}
function recordSession(){
  const sess=S.session;if(!sess||!sess.v2)return;
  if(!S.classes.some(c=>c.id===sess.classId))return;
  S.sessPts=S.sessPts||{};
  S.sessPts[sess.id]={classId:sess.classId,date:sess.created,pts:sessPtsOf(sess)};
}
function cumul(st){let t=st.pts||0;const all=S.sessPts||{};for(const k in all){const e=all[k];if(e.pts&&e.pts[st.id])t+=e.pts[st.id]}return t}
function sessSum(st){return cumul(st)-(st.pts||0)}
function save(){try{recordSession();localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('⚠️ Sauvegarde impossible sur cet appareil')}}

let tab=S.session?'seance':(S.cards.length?'seance':'codes');
let mode=null, modalSticky=false, setup=null, undoStack=[], clsView='groupes', codeFilter={q:'',st:0};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function openModal(html,sticky=false){$('#md').innerHTML=html;$('#ov').classList.add('on');modalSticky=sticky;const f=$('#md').querySelector('[autofocus]');if(f)setTimeout(()=>f.focus(),50)}
function closeModal(){$('#ov').classList.remove('on');$('#md').innerHTML=''}
function confirmBox(msg,fn,okLabel='Confirmer',danger=true){
  window._cf=fn;
  openModal(`<h2>${msg}</h2><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn ${danger?'orange':'primary'}" onclick="closeModal();_cf()">${okLabel}</button></div>`);
}

/* ============ verrou prof ============ */
const isProf=()=>mode==='prof';
const P=h=>isProf()?h:'';
function needPin(fn){
  if(isProf())return fn();
  window._pf=fn;
  openModal(`<h2>🔒 Espace professeur</h2><p class="sub">Entre le mot de passe prof pour continuer.</p>
  <input type="password" inputmode="numeric" id="pinin" autofocus onkeydown="if(event.key==='Enter')checkPin()">
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="checkPin()">Déverrouiller</button></div>`);
}
function checkPin(){if($('#pinin').value===(S.settings.pin||'2335')){mode='prof';closeModal();renderHead();_pf()}else{$('#pinin').value='';toast('Mot de passe incorrect')}}
function toggleLock(){closeModal();mode=null;document.body.classList.remove('fs');render()}
function chooseMode(m){
  if(m==='eleve'){mode='eleve';if(['codes','classes','reglages'].includes(tab))tab='seance';render();return}
  needPin(()=>{if(!S.cards.length&&!S.session)tab='codes';render()});
}
function rRole(){
  $('#nav').innerHTML='';$('#lockbtn').style.display='none';
  $('#htitle').textContent="Course d'orientation";
  $('#main').innerHTML=`<div style="max-width:720px;margin:6vh auto 0;text-align:center">
   <h2 style="font-size:26px">Qui utilise la tablette ?</h2>
   <p class="sub">${S.session?'Une séance est en cours'+(S.session.room?' (code '+esc(S.session.room)+')':'')+'.':'Choisis ton espace.'}</p>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:20px">
    <button class="card" style="cursor:pointer;padding:30px 16px;border:2px solid var(--line)" onclick="chooseMode('eleve')"><div style="font-size:56px">🧭</div><h2 style="margin:8px 0 4px">Élève</h2><p class="sub" style="margin:0">Prendre une carte, valider un code, voir le classement</p></button>
    <button class="card" style="cursor:pointer;padding:30px 16px;border:2px solid var(--line)" onclick="chooseMode('prof')"><div style="font-size:56px">👨‍🏫</div><h2 style="margin:8px 0 4px">Prof</h2><p class="sub" style="margin:0">🔒 Mot de passe · séances, classes, codes, réglages</p></button>
   </div></div>`;
}

/* ============ navigation ============ */
const TABS=[['seance','🏃 Séance'],['classement','🏆 Classement'],['classes','👥 Classes'],['codes','🔑 Codes'],['reglages','⚙️ Réglages']];
const PROT=['classes','codes','reglages'];
function go(t){if(PROT.includes(t))needPin(()=>{tab=t;render()});else{tab=t;render()}}
const visibleTabs=()=>TABS.filter(([k])=>isProf()||!PROT.includes(k));
function renderHead(){
  if(!mode)return;
  $('#nav').innerHTML=visibleTabs().map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const lb=$('#lockbtn');
  lb.style.display='';lb.textContent=isProf()?'👨‍🏫 Prof · changer':'🧭 Élève · changer';
  const c=curClass();$('#htitle').innerHTML=esc("Course d'orientation"+(S.session&&c?' · '+c.name:(S.session&&S.session.className?' · '+S.session.className:'')))+(isOnline()?' <small style="font-weight:600;opacity:.85">📡 '+esc(S.session.room)+'</small>'+syncDot():'');
}
function render(){if(!mode)return rRole();if(!isProf()&&PROT.includes(tab))tab='seance';renderHead();({seance:rSeance,classement:rClassement,classes:rClasses,codes:rCodes,reglages:rReglages})[tab]();}

/* ============ données ============ */
const curClass=()=>S.classes.find(c=>c.id===(S.session?S.session.classId:S.classId))||null;
const stu=id=>{for(const c of S.classes){const s=c.students.find(x=>x.id===id);if(s)return s}const r=S.session&&S.session.roster&&S.session.roster[id];return r?{id,...r,pts:0}:null};
const G=id=>S.session.groups.find(g=>g.id===id);
const findCard=num=>S.cards.find(c=>String(c.carte)===String(num));
const cardsOf=st=>S.cards; // chaque carte existe en 1 à 6 étoiles, mêmes réponses
const levelsAvail=()=>S.cards.length?allowedLv():[];
const allowedLv=()=>{const a=S.session&&S.session.allowed;return a&&a.length?[...a].sort((x,y)=>x-y):[1,2,3,4,5,6]};
const clampAllowed=l=>{const a=allowedLv();return a.reduce((p,c)=>Math.abs(c-l)<Math.abs(p-l)?c:p,a[0])};
const lvUp=l=>{const a=allowedLv();return a.find(x=>x>l)??a[a.length-1]};
const lvDown=l=>{const a=allowedLv();return [...a].reverse().find(x=>x<l)??a[0]};
function pushUndo(label){undoStack.push({label,data:JSON.stringify({session:S.session,classes:S.classes})});if(undoStack.length>20)undoStack.shift()}
function undo(){
  const u=undoStack.pop();if(!u)return toast('Rien à annuler');
  const d=JSON.parse(u.data);S.session=d.session;S.classes=d.classes;save();render();toast('Annulé : '+u.label);
}

/* ============ EXCEL : lecture / écriture minimales ============ */
const colIdx=ref=>{const m=/^([A-Z]+)/.exec(ref||'');if(!m)return -1;let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1};
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26|0}return s};
async function readWorkbook(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.txt')){
    const txt=await file.text();const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const sep=(lines[0]||'').includes(';')?';':((lines[0]||'').includes('\t')?'\t':',');
    return[{name:file.name.replace(/\.\w+$/,''),rows:lines.map(l=>l.split(sep).map(v=>{v=v.trim().replace(/^"|"$/g,'');return v!==''&&!isNaN(v)?+v:v}))}];
  }
  if(typeof JSZip==='undefined')throw new Error('Module Excel indisponible');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const X=async p=>{const f=zip.file(p);return f?new DOMParser().parseFromString(await f.async('string'),'application/xml'):null};
  const ss=[];const sst=await X('xl/sharedStrings.xml');
  if(sst)for(const si of sst.getElementsByTagName('si')){let t='';for(const tt of si.getElementsByTagName('t'))if(tt.parentNode.nodeName!=='rPh')t+=tt.textContent;ss.push(t)}
  const wb=await X('xl/workbook.xml');if(!wb)throw new Error('Fichier non reconnu (enregistre-le en .xlsx)');
  const rels=await X('xl/_rels/workbook.xml.rels');const rm={};
  if(rels)for(const r of rels.getElementsByTagName('Relationship'))rm[r.getAttribute('Id')]=r.getAttribute('Target');
  const out=[];
  for(const sh of wb.getElementsByTagName('sheet')){

    const rows=[];let ri=0;
    for(const row of doc.getElementsByTagName('row')){
      const r=row.getAttribute('r');ri=r?(+r-1):ri;const arr=[];let ci=0;
      for(const c of row.getElementsByTagName('c')){
        const ref=c.getAttribute('r');ci=ref?colIdx(ref):ci;
        const ty=c.getAttribute('t');const vEl=c.getElementsByTagName('v')[0];let v=vEl?vEl.textContent:null;
        if(ty==='s')v=ss[+v];
        else if(ty==='inlineStr'){v='';for(const tt of c.getElementsByTagName('t'))v+=tt.textContent}
        else if(ty==='b')v=v==='1';
        else if(ty!=='str'&&ty!=='e'&&v!=null&&v!==''&&!isNaN(v))v=+v;
        if(v!=null&&v!=='')arr[ci]=v;ci++;
      }
      rows[ri]=arr;ri++;
    }
    out.push({name:sh.getAttribute('name'),rows:Array.from(rows,r=>r||[])});
  }

}

  sheets.forEach((s,i)=>{
    const w=[];s.rows.forEach(r=>r.forEach((v,j)=>{w[j]=Math.max(w[j]||8,Math.min(40,String(v??'').length+2))}));
    const body=s.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{
      if(v==null||v==='')return'';const ref=colName(ci)+(ri+1);const st=ri===0?' s="1"':'';
      return typeof v==='number'?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join('')}</row>`).join('');
    z.file(`xl/worksheets/sheet${i+1}.xml`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${w.map((x,j)=>`<col min="${j+1}" max="${j+1}" width="${x}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData></worksheet>`);

/* ============ import des codes ============ */
function starsFromSheetName(n){
  const s=norm(n);const k=(n.match(/★/g)||[]).length;if(k>=1&&k<=6)return k;
  const m=/^(?:niveau|niv|n|parcours)?\s*([1-6])\s*(?:etoiles?|\*+|e)?$/.exec(s);return m?+m[1]:null;
}
function parseStars(v){if(v==null)return null;if(typeof v==='number')return v>=1&&v<=6?Math.round(v):null;const k=(String(v).match(/[★*]/g)||[]).length;if(k>=1&&k<=6)return k;const m=/([1-6])/.exec(String(v));return m?+m[1]:null}
const isLetter=v=>typeof v==='string'&&/^[A-Za-z]$/.test(v.trim());
function parseCodes(sheets){
  const cards=new Map();const warns=[];const dup=new Set();const lens={};
  for(const sh of sheets){
    const rows=sh.rows;let h=-1;
    for(let i=0;i<Math.min(15,rows.length);i++)if((rows[i]||[]).some(v=>/carte/.test(norm(v)))){h=i;break}
    if(h<0)continue;
    const hd=(rows[h]||[]).map(norm);const W=Math.max(...rows.map(r=>r.length),hd.length);
    let iC=hd.findIndex(v=>/carte/.test(v));
    let iS=hd.findIndex(v=>/etoile|niveau|star|★|\bniv\b/.test(v));
    let iD=hd.findIndex(v=>/depart/.test(v));
    let iA=hd.findIndex(v=>/arrivee|arrive|\bfin\b/.test(v));
    const used=new Set([iC,iS,iD,iA].filter(x=>x>=0));
    let codeCols=[];for(let j=0;j<W;j++)if(!used.has(j)&&/balise|code|^b\s*\d+$|^c\s*\d+$|^poste/.test(hd[j]||''))codeCols.push(j);
    const data=rows.slice(h+1).filter(r=>r&&r[iC]!=null&&r[iC]!=='');
    if(!codeCols.length){ // colonnes numériques restantes
      for(let j=0;j<W;j++)if(!used.has(j)){const vals=data.map(r=>r[j]).filter(v=>v!=null&&v!=='');if(vals.length&&vals.filter(v=>typeof v==='number').length/vals.length>.8)codeCols.push(j)}
    }
    if(!codeCols.length){warns.push(`Feuille « ${sh.name} » : aucune colonne de code trouvée.`);continue}
    // lettres sans titre explicite
    const letterCol=j=>{const vals=data.map(r=>r[j]).filter(v=>v!=null&&v!=='');return vals.length&&vals.filter(isLetter).length/vals.length>.8};
    if(iD<0){for(let j=0;j<codeCols[0];j++)if(!used.has(j)&&letterCol(j)){iD=j;used.add(j);break}}
    if(iA<0){for(let j=W-1;j>codeCols[codeCols.length-1];j--)if(!used.has(j)&&letterCol(j)){iA=j;used.add(j);break}}
    for(const r of data){
      const code=codeCols.map(j=>r[j]);if(code.some(v=>v==null||v===''))continue;
      const c={carte:String(r[iC]).trim(),code:code.map(v=>typeof v==='number'?v:String(v).trim()),dep:iD>=0&&r[iD]!=null?String(r[iD]).trim().toUpperCase():'',arr:iA>=0&&r[iA]!=null?String(r[iA]).trim().toUpperCase():''};
      const prev=cards.get(c.carte);
      if(prev&&JSON.stringify([prev.code,prev.dep,prev.arr])!==JSON.stringify([c.code,c.dep,c.arr]))dup.add(c.carte);
      if(!prev){cards.set(c.carte,c);lens[code.length]=(lens[code.length]||0)+1}
    }
  }
  if(dup.size)warns.push(`Carte(s) ${[...dup].slice(0,10).join(', ')}${dup.size>10?'…':''} présente(s) plusieurs fois avec des codes différents : seule la 1re ligne est gardée.`);
  const L=Object.keys(lens).map(Number);if(L.some(l=>l!==6))warns.push(`Codes de ${L.join(' / ')} nombres détectés (attendu : 6). L'appli s'adapte à la longueur trouvée.`);
  return{cards:[...cards.values()],warns};
}
function importCodes(){
  pickFile('.xlsx,.xlsm,.csv',async f=>{
    try{
      const sheets=await readWorkbook(f);const{cards,warns}=parseCodes(sheets);
      if(!cards.length){openModal(`<h2>Aucun code trouvé</h2><p>Vérifie qu'une ligne d'en-tête contient « Carte ». Télécharge le modèle pour voir le format attendu.</p><div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeModal()">OK</button></div>`);return}
      const apply=mode=>{
        if(mode==='replace')S.cards=cards;else{const m=new Map(S.cards.map(c=>[String(c.carte),c]));cards.forEach(c=>m.set(String(c.carte),c));S.cards=[...m.values()]}
        S.importInfo={file:f.name,date:new Date().toLocaleDateString('fr-FR')};save();closeModal();render();toast(cards.length+' cartes importées')};
      window._imp=apply;
      openModal(`<h2>Import : ${cards.length} cartes</h2>
        <p class="sub">Chaque carte est utilisable de ★ à ★★★★★★ (mêmes réponses à tous les niveaux).</p>
        <p class="sub" style="margin-top:10px">Lettre de départ : <b>${cards.some(c=>c.dep)?'oui':'non'}</b> · Lettre d'arrivée : <b>${cards.some(c=>c.arr)?'oui':'non'}</b></p>
        ${warns.map(w=>`<div class="warn">${esc(w)}</div>`).join('')}
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Annuler</button>
        ${S.cards.length?`<button class="btn" onclick="_imp('merge')">Ajouter / mettre à jour</button>`:''}
        <button class="btn primary" onclick="_imp('replace')">${S.cards.length?'Remplacer tout':'Importer'}</button></div>`);
    }catch(e){console.error(e);toast('Erreur de lecture : '+e.message)}
  });
}
function downloadTemplate(){
  const rows=[['Carte','Départ','Code 1','Code 2','Code 3','Code 4','Code 5','Code 6','Arrivée']];

function makeGroups(){
  const cls=S.classes.find(c=>c.id===setup.classId);const studs=cls.students.filter(s=>!setup.absent[s.id]);
  const n=studs.length,size=setup.size;
  let g=setup.nGroups||(size===1?n:Math.max(1,Math.round(n/size-0.01)));g=clamp(g,1,n);
  const arr=shuffle([...studs]);const groups=Array.from({length:g},()=>[]);
  if(size===1&&!setup.nGroups)arr.forEach((s,i)=>groups[i].push(s));
  else if(setup.compo==='aleatoire')arr.forEach((s,i)=>groups[i%g].push(s));
  else{
    arr.sort((a,b)=>score(b)-score(a));
    if(setup.compo==='homogene'){const base=n/g|0,ex=n%g;let k=0;for(let i=0;i<g;i++){const sz=base+(i<ex?1:0);groups[i]=arr.slice(k,k+sz);k+=sz}}
    else arr.forEach((s,i)=>{const r=i/g|0,p=i%g;groups[r%2?g-1-p:p].push(s)});
  }
  setup.groups=groups.map(m=>m.map(s=>s.id));rSetup();
  setTimeout(()=>{const e=$('#gedit');if(e)e.scrollIntoView({behavior:'smooth'})},50);
}

}

   ${dots?`<div class="dots">${dots}</div>`:''}${body}</div>`;

function pickCard(st,g){
  const pool=cardsOf(st);if(!pool.length)return null;
  const busy=new Set(S.session.groups.filter(x=>x.cur).map(x=>String(x.cur.carte)));
  const done=new Set(g?g.done.map(String):[]);
  let c=pool.filter(c=>!busy.has(String(c.carte))&&!done.has(String(c.carte)));
  if(!c.length)c=pool.filter(c=>!busy.has(String(c.carte)));
  if(!c.length)c=pool;
  return c[Math.random()*c.length|0];
}

function cardCheck(num){
  const g=G(assign.gid);num=String(num||'').trim();

  const c=findCard(num);
  if(!c)return{ok:false,msg:`❌ La carte n°${esc(num)} n'existe pas dans les codes.`};
  if(g.done.map(String).includes(c.carte)&&!(g.cur&&String(g.cur.carte)===c.carte))return{ok:false,msg:`⚠️ Ton équipe a déjà fait la carte n°${esc(num)} (mêmes réponses à tous les niveaux). Choisis-en une autre.`};
  const other=S.session.groups.find(x=>x.id!==g.id&&x.cur&&String(x.cur.carte)===c.carte);
  return{ok:true,card:c,msg:other?`ℹ️ ${esc(other.name)} court déjà avec la carte n°${esc(num)}.`:`✅ Carte n°${esc(num)} trouvée.`};
}

function openValidate(gid){
  const g=G(gid);if(!g||!g.cur){toast('Cette carte a déjà été validée');return render()}
  const c=g.cur;const card=findCard(c.carte,c.stars);
  if(!card)return toast('Carte introuvable dans les codes');
  let f='';
  if(card.dep)f+=`<div class="cgroup"><small>Départ</small><input class="cbox letter" data-k="dep" maxlength="1" autocomplete="off" autocapitalize="characters"></div><div class="sep"></div>`;
  card.code.forEach((v,i)=>{f+=`<div class="cgroup"><small>${i+1}</small><input class="cbox" data-k="${i}" maxlength="2" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>`});
  if(card.arr)f+=`<div class="sep"></div><div class="cgroup"><small>Arrivée</small><input class="cbox letter" data-k="arr" maxlength="1" autocomplete="off" autocapitalize="characters"></div>`;
  openModal(`<h2>${esc(g.name)}</h2><p class="sub">Carte <b>${esc(c.carte)}</b> ${starsH(c.stars)} · <span class="timer" data-t0="${c.t0}"></span></p>
  <p style="margin:0">Tape ton code secret :</p><div class="codeform" id="cf">${f}</div><div id="cfmsg" class="sub" style="text-align:center;min-height:20px"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" style="padding:12px 22px" onclick="submitCode('${gid}')">Valider</button></div>`,true);
  const ins=[...document.querySelectorAll('#cf .cbox')];
  ins.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{
      if(inp.classList.contains('letter'))inp.value=inp.value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,1);
      else inp.value=inp.value.replace(/\D/g,'').slice(0,2);
      inp.classList.remove('bad');
      const full=inp.classList.contains('letter')?inp.value.length===1:inp.value.length===2;
      if(full&&ins[i+1])ins[i+1].focus();
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1]){ins[i-1].focus();e.preventDefault()}if(e.key==='Enter')submitCode(gid)});
  });
  setTimeout(()=>{const ae=document.activeElement;if(!ae||!ae.classList||!ae.classList.contains('cbox'))ins[0].focus()},60);tick();
}
const eqv=(a,b)=>{const A=String(a??'').trim(),B=String(b??'').trim();if(A!==''&&B!==''&&!isNaN(A)&&!isNaN(B))return +A===+B;return norm(A)===norm(B)};
function submitCode(gid){
  const g=G(gid);if(!g||!g.cur){closeModal();toast('Cette carte a déjà été validée');return render()}
  const card=findCard(g.cur.carte,g.cur.stars);
  const ins=[...document.querySelectorAll('#cf .cbox')];
  if(ins.some(i=>!i.value)){$('#cfmsg').innerHTML='<b style="color:var(--orange)">Complète toutes les cases.</b>';ins.find(i=>!i.value).focus();return}
  const errs=[];
  ins.forEach(i=>{const k=i.dataset.k;const exp=k==='dep'?card.dep:k==='arr'?card.arr:card.code[+k];if(!eqv(i.value,exp))errs.push(k)});
  closeModal();applyResult(gid,errs.length===0,errs);
}
function award(g,pts){g.pts+=pts}
/* applique un résultat : fonction pure sur S.session (rejouable en mode multi-tablettes) */
function applyResult(gid,ok,errs){
  const g0=G(gid);if(!g0||!g0.cur)return;
  const t0=g0.cur.t0,now=Date.now(),time=now-t0;
  const info=act('validation '+g0.name,()=>resultMut(gid,t0,ok,time,now));
  if(!info)return;
  if(info.duel)showResult(ok,errs,`${info.pts?'+'+info.pts+' points':'0 point'} · ${fmtT(time)}`,info.msg,info.name);
  else showResult(ok,errs,`${ok?`+${info.pts} point${info.pts>1?'s':''}`:'0 point'} · ${fmtT(time)}`,
    S.session&&S.session.mode==='progression'?(ok?(info.level>info.before?`Niveau suivant : ${starsH(info.level)}`:`Niveau max ${starsH(info.level)} conservé !`):(info.level<info.before?`Tu redescends : ${starsH(info.level)}`:`Tu restes au niveau ${starsH(info.level)}`)):'',info.name);
}
function resultMut(gid,t0,ok,time,now){
  const g=G(gid);if(!g||!g.cur||g.cur.t0!==t0)return null;
  const c=g.cur;const st=c.stars;
  const key=String(c.carte);if(!g.done.includes(key))g.done.push(key);
  if(c.duel)return duelMut(g,ok,time,now);
  const pts=ok?(S.settings.ptsMode==='stars'?st:1):0;
  award(g,pts);
  if(ok)g.maxLevel=Math.max(g.maxLevel||0,st);
  const before=g.level;
  if(S.session.mode==='progression')g.level=ok?lvUp(g.level):lvDown(g.level);
  g.hist.push({carte:c.carte,stars:st,ok,pts,time,ts:now,members:[...g.members]});
  g.cur=null;
  return{pts,before,level:g.level,name:g.name};
}
function showResult(ok,errs,line,line2,name){
  let det='';
  if(!ok&&errs.length&&S.settings.showErrors!=='none'){
    if(S.settings.showErrors==='count')det=`<p>${errs.length} erreur${errs.length>1?'s':''} dans le code.</p>`;
    else det=`<p>À revoir : ${errs.map(k=>k==='dep'?'lettre de départ':k==='arr'?"lettre d'arrivée":'balise n°'+(+k+1)).join(', ')}</p>`;
  }
  openModal(`<div class="result ${ok?'ok':'ko'}"><div class="ic">${ok?'🎉':'❌'}</div><h2>${ok?'Bravo !':'Code faux'}</h2><p class="sub">${esc(name)}</p><p style="font-size:20px;font-weight:800">${line}</p>${det}${line2?`<p>${line2}</p>`:''}
  <button class="btn primary big" onclick="closeModal()">OK</button></div>`);
}

function toggleLiveLv(l){let a=allowedLv();if(a.includes(l)){if(a.length===1)return toast('Garde au moins un niveau');a=a.filter(x=>x!==l)}else a=[...a,l].sort((x,y)=>x-y);

/* ---- DÉFIS ---- */
function pairDuels(){
  const s=S.session;let gs=[...s.groups];
  if(s.pairing==='aleatoire')shuffle(gs);
  else gs.sort((a,b)=>(b.pts-a.pts)||(avgLevel(b.members)-avgLevel(a.members))||(Math.random()-.5));
  let bye=null;
  if(gs.length%2){const minB=Math.min(...gs.map(g=>g.byes));const cands=gs.filter(g=>g.byes===minB);bye=cands[cands.length-1];bye.byes++;gs=gs.filter(g=>g!==bye)}
  s.round=(s.round||0)+1;
  s.duels=[];for(let i=0;i<gs.length;i+=2){const a=gs[i],b=gs[i+1];
    const auto=clamp(Math.round((avgLevel(a.members)+avgLevel(b.members))/2),1,6);
    s.duels.push({id:uid(),a:a.id,b:b.id,stars:nearestLevel(auto),manche:0,state:'wait',score:{a:0,b:0},res:{},winner:null,t0:null})}
  s.bye=bye?bye.id:null;
}
function nearestLevel(st){const lv=levelsAvail();return lv.reduce((a,b)=>Math.abs(b-st)<Math.abs(a-st)?b:a,lv[0]||1)}
const D=id=>S.session.duels.find(d=>d.id===id);
function rDefi(){
  const s=S.session;const fmt=s.size+' contre '+s.size;
  const bye=s.bye&&G(s.bye);
  $('#main').innerHTML=`<div class="toolbar"><h2>⚔️ Défis ${fmt} <span class="pill">Tour ${s.round}</span></h2>
    ${s.room||!isProf()?'':`<button class="btn sm" onclick="undo()" ${undoStack.length?'':'disabled'}>↶ Annuler</button>`}
    <button class="btn sm" onclick="go('classement')">🏆</button>
    ${P(`<button class="btn sm" onclick="editLevels()">★ Niveaux</button>
    <button class="btn sm" onclick="newRound()">🔀 Nouveaux duels</button>
    <button class="btn sm danger" onclick="endSession()">Terminer</button>`)}</div>
    ${syncBanner()}
    ${bye?`<div class="info">⏸ <b>${esc(bye.name)}</b> est exempté ce tour-ci (nombre d'équipes impair).</div>`:''}
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${s.duels.map(duelCard).join('')}</div>`;
  tick();
}
function duelCard(d,i){
  const A=G(d.a),B=G(d.b);if(!A||!B)return'';
  const side=(g,k)=>{
    const r=d.res[k];const mem=g.members.map(id=>esc(stu(id)?.name||'?')).join(', ');
    let st='';
    if(d.state==='run'||d.state==='done'){
      st=`<div>Carte <b style="font-size:20px">${esc(d.cards?.[k]||'')}</b></div>`;
      if(r)st+=r.ok?`<div style="color:var(--ok);font-weight:800">✔ Code juste · ${fmtT(r.time)}</div>`:`<div style="color:var(--red);font-weight:800">✘ Code faux</div>`;
      else if(d.state==='run')st+=`<button class="btn primary" onclick="openValidate('${g.id}')">✅ Valider</button>`;
    }
    return`<div class="side ${d.winner===k?'win':''}" style="--c:${g.color}"><b>${d.winner===k?'🏆 ':''}${esc(g.name)}</b>${g.members.length>1?`<span class="sub">${mem}</span>`:''}<span class="pts" style="font-size:15px">${g.pts} pts</span>${st}</div>`};
  let foot='';
  if(d.state==='wait')foot=`<p class="sub" style="margin:10px 0 6px">Niveau de la manche ${d.manche+1} :</p><div class="starpick" style="grid-template-columns:repeat(6,1fr)">${[1,2,3,4,5,6].map(l=>`<button class="${d.stars===l?'on':''}" ${allowedLv().includes(l)?'':'disabled style="opacity:.25"'} style="font-size:13px;padding:8px 2px" onclick="setDuelStars('${d.id}',${l})">${l}★</button>`).join('')}</div><button class="btn orange big" style="margin-top:8px" onclick="launchDuel('${d.id}')">▶ Lancer la manche</button>`;
  else if(d.state==='run')foot=`<div class="row" style="margin-top:8px"><span class="sub">${starsH(d.stars)} · <span class="timer" data-t0="${d.t0}"></span></span><span class="grow"></span>${P(`<button class="btn sm ghost" onclick="closeDuel('${d.id}')">Clore la manche</button>`)}</div>`;
  else foot=`<div class="info" style="margin:8px 0">${d.winner?`🏆 <b>${esc((d.winner==='a'?A:B).name)}</b> remporte la manche !`:'Manche nulle : aucun code juste.'}</div><button class="btn big" onclick="nextManche('${d.id}')">➡ Manche suivante</button>`;
  return`<div class="duel"><div class="dhead"><b>Duel ${i+1}${d.manche?` · manche ${d.manche}`:''}</b><span class="score">${d.score.a} – ${d.score.b}</span></div>
   <div class="sides">${side(A,'a')}<div class="vs">VS</div>${side(B,'b')}</div>${foot}</div>`;
}
function setDuelStars(did,l){act('niveau duel',()=>{const d=D(did);if(d&&d.state==='wait')d.stars=l})}
function launchDuel(did){
  const d=D(did);if(!d||d.state!=='wait')return render();const A=G(d.a),B=G(d.b);
  const ca=pickCard(d.stars,A);if(!ca)return toast('Aucune carte à ce niveau');
  let cb=pickCard(d.stars,B);let tries=0;while(cb&&cb.carte===ca.carte&&S.cards.length>1&&tries++<20)cb=pickCard(d.stars,B);
  const t0=Date.now(),st=d.stars,i=S.session.duels.indexOf(d);
  const okLaunch=act('lancement duel',()=>{const d=D(did);if(!d||d.state!=='wait')return false;const A=G(d.a),B=G(d.b);
    A.cur={carte:ca.carte,stars:st,t0,duel:d.id,side:'a'};B.cur={carte:cb.carte,stars:st,t0,duel:d.id,side:'b'};
    Object.assign(d,{stars:st,state:'run',t0,res:{},winner:null,cards:{a:ca.carte,b:cb.carte},manche:d.manche+1});return true});
  if(!okLaunch)return;
  openModal(`<h2>Duel ${i+1} — manche ${D(did)?.manche||''} ${starsH(st)}</h2><div class="sides" style="margin-top:12px"><div class="side" style="--c:${A.color}"><b>${esc(A.name)}</b><span class="sub">Carte n°</span><div class="bignum">${esc(ca.carte)}</div></div><div class="vs">VS</div><div class="side" style="--c:${B.color}"><b>${esc(B.name)}</b><span class="sub">Carte n°</span><div class="bignum">${esc(cb.carte)}</div></div></div><button class="btn primary big" style="margin-top:14px" onclick="closeModal()">Partez !</button>`);
}
/* le vainqueur est le code juste au temps le plus court (indépendant de l'ordre de synchronisation) */
function duelMut(g,ok,time,now){
  const s=S.session;const c=g.cur;const d=s.duels.find(x=>x.id===c.duel);const k=c.side;const st=c.stars;
  if(!d){g.cur=null;return{duel:true,pts:0,msg:'Duel terminé.',name:g.name}}
  const bonus=+S.settings.defiBonus||0,lose=S.settings.defiLosePts?st:0;
  d.res[k]={ok,time};
  let pts=0,msg,win=false;
  const other=k==='a'?'b':'a';
  if(ok){
    const w=d.winner;
    if(!w||(w===other&&d.res[other]&&d.res[other].time>time)){
      if(w===other){const og=G(other==='a'?d.a:d.b);const oh=[...og.hist].reverse().find(h=>h.duel&&h.win&&h.duelId===d.id);
        const delta=(st+bonus)-lose;if(oh){oh.pts-=delta;oh.win=false}og.pts-=delta;og.wins=Math.max(0,(og.wins||0)-1);d.score[other]=Math.max(0,d.score[other]-1)}
      d.winner=k;d.score[k]++;g.wins=(g.wins||0)+1;pts=st+bonus;win=true;msg='🏆 Code juste le plus rapide : manche gagnée !';
    }else{pts=lose;msg="Code juste, mais l'adversaire a été plus rapide."}
  }else msg='Code faux.';
  award(g,pts);
  g.hist.push({carte:c.carte,stars:st,ok,pts,time,ts:now,members:[...g.members],duel:true,duelId:d.id,win});
  g.cur=null;
  if(d.res[other]||(d.winner&&!S.settings.defiLosePts))finishDuel(d);
  return{duel:true,pts,msg,name:g.name};
}
function finishDuel(d){d.state='done';[d.a,d.b].forEach(id=>{const g=G(id);if(g&&g.cur&&g.cur.duel===d.id)g.cur=null})}
function closeDuel(did){confirmBox('Clore la manche ? Les équipes qui n\'ont pas validé marquent 0.',()=>{const now=Date.now();act('clôture manche',()=>{const d=D(did);if(!d||d.state!=='run')return;[['a',d.a],['b',d.b]].forEach(([k,id])=>{if(!d.res[k]){const g=G(id);if(g&&g.cur){g.hist.push({carte:g.cur.carte,stars:g.cur.stars,ok:false,pts:0,time:null,ts:now,members:[...g.members],duel:true,duelId:d.id});d.res[k]={ok:false}}}});finishDuel(d)})},'Clore')}
function nextManche(did){act('manche suivante',()=>{const d=D(did);if(!d||d.state!=='done')return;d.state='wait';d.res={};d.winner=null;d.cards=null})}
function newRound(){
  const running=S.session.duels.some(d=>d.state==='run');
  confirmBox(running?'Des manches sont en cours. Créer de nouveaux duels quand même ?':'Créer de nouveaux duels ?<br><small class="sub">'+(S.session.pairing==='niveau'?'Appariement selon les points de la séance.':'Adversaires tirés au sort.')+'</small>',()=>{act('nouveaux duels',()=>{S.session.groups.forEach(g=>g.cur=null);pairDuels()})},'Nouveaux duels',false);
}

/* ============ MULTI-TABLETTES (synchronisation via le serveur Netlify) ============ */
const API='/api/sync';
const SYNC={room:null,etag:null,remote:null,pending:[],busy:false,status:'off',lastOk:0,timer:null,ending:false};
const clone=o=>JSON.parse(JSON.stringify(o));
const canSync=()=>location.protocol.startsWith('http');
const isOnline=()=>!!(S.session&&S.session.room);
function genRoom(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<5;i++)r+=A[Math.random()*A.length|0];return r}
async function apiGet(room,key,etag){
  const h={};if(etag)h['x-if-none-match']=etag;
  const r=await fetch(`${API}?room=${encodeURIComponent(room)}&key=${key}`,{headers:h,cache:'no-store'});
  if(r.status===304)return{status:304};
  if(r.status===404)return{status:404};
  if(!r.ok)throw new Error('Serveur : erreur '+r.status);
  return{status:200,etag:r.headers.get('x-etag'),data:await r.json()};
}
async function apiPut(room,key,data,o={}){
  const h={'content-type':'application/json'};if(o.ifMatch)h['x-if-match']=o.ifMatch;if(o.ifNew)h['x-if-none-match']='*';
  const r=await fetch(`${API}?room=${encodeURIComponent(room)}&key=${key}`,{method:'PUT',headers:h,body:JSON.stringify(data)});
  if(r.status===412)return{status:412};
  if(!r.ok)throw new Error('Serveur : erreur '+r.status);
  const j=await r.json();return{status:200,etag:j.etag};
}
/* toute modification de la séance passe par act() : appliquée tout de suite ici, puis envoyée aux autres tablettes */
function act(label,fn){
  if(!isOnline()){pushUndo(label);const r=fn();save();render();return r}
  const r=fn();SYNC.pending.push(fn);save();render();flush();return r;
}
function rebuild(){
  if(!SYNC.remote||SYNC.ending)return;
  S.session=clone(SYNC.remote);
  for(const f of SYNC.pending){try{f()}catch(e){console.warn(e)}}
  save();handleEnded();
}
function setStatus(st){SYNC.status=st;if(st==='ok')SYNC.lastOk=Date.now();const el=$('#syncdot');if(el)el.outerHTML=syncDot()}
function syncDot(){
  if(!isOnline()&&!SYNC.ending)return'<span id="syncdot"></span>';
  const p=SYNC.pending.length;const c=SYNC.status==='err'?'#d23c3c':p?'#ee7a1a':'#2ecc71';
  const t=SYNC.status==='err'?'hors ligne':p?'envoi…':'synchronisé';
  return`<span id="syncdot" title="${t}" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-left:6px;vertical-align:middle"></span>`;
}
function syncBanner(){
  if(!isOnline())return'';
  const err=SYNC.status==='err';
  return`<div class="${err?'warn':'info'}" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">📡 Séance multi-tablettes · code <b style="font-size:18px;letter-spacing:2px">${esc(S.session.room)}</b> ${syncDot()}
   <span class="sub">${err?'Pas de connexion : les résultats sont gardés sur cette tablette et seront envoyés dès le retour du réseau.':(SYNC.pending.length?'Envoi en cours…':'Toutes les tablettes sont à jour.')}</span>
   <span class="grow"></span><button class="btn sm" onclick="showRoom()">Ajouter une tablette</button></div>`;
}
function showRoom(){
  openModal(`<h2>📡 Ajouter une tablette</h2><p>Sur l'autre tablette, ouvre <b>${esc(location.host)}</b>, onglet <b>Séance</b> → <b>Rejoindre une séance</b>, puis tape ce code :</p>
  <div class="bignum" style="letter-spacing:8px">${esc(S.session.room)}</div>
  <p class="sub">Toutes les tablettes doivent avoir internet (partage de connexion 5G du prof, par exemple).</p>
  <div class="row" style="justify-content:space-between;margin-top:14px">${isProf()?'<button class="btn danger" onclick="leaveRoom()">Quitter sur cette tablette</button>':'<span></span>'}<button class="btn primary" onclick="closeModal()">OK</button></div>`);
}
function leaveRoom(){confirmBox('Quitter la séance sur cette tablette ?<br><small class="sub">La séance continue sur les autres tablettes. Tu pourras la rejoindre à nouveau avec le code.</small>',()=>{stopSync();S.session=null;save();render()},'Quitter')}
async function flush(){
  if(SYNC.busy||!SYNC.pending.length||!SYNC.room)return;
  SYNC.busy=true;setStatus(SYNC.status);
  try{
    while(SYNC.pending.length){
      if(!SYNC.remote){await pull(true);continue}
      const fn=SYNC.pending[0];
      const saved=S.session;S.session=clone(SYNC.remote);try{fn()}catch(e){console.warn(e)}const cand=S.session;S.session=saved;
      const r=await apiPut(SYNC.room,'state',cand,{ifMatch:SYNC.etag});
      if(r.status===412){await pull(true);continue}
      SYNC.remote=cand;SYNC.etag=r.etag;SYNC.pending.shift();
    }
    setStatus('ok');
  }catch(e){console.warn(e);setStatus('err');clearTimeout(SYNC.retry);SYNC.retry=setTimeout(flush,3000)}
  finally{
    SYNC.busy=false;
    if(SYNC.ending&&!SYNC.pending.length){stopSync();softRender();return}
    rebuild();softRender();
  }
}
async function pull(force){
  const r=await apiGet(SYNC.room,'state',force?null:SYNC.etag);
  if(r.status===304){setStatus(SYNC.pending.length?SYNC.status:'ok');return false}
  if(r.status===404)throw new Error('Séance introuvable');
  SYNC.remote=r.data;SYNC.etag=r.etag;if(!SYNC.pending.length)setStatus('ok');return true;
}
async function poll(){
  if(!SYNC.room||SYNC.busy||SYNC.ending||document.hidden)return;
  try{if(await pull()){rebuild();softRender()}}catch(e){setStatus('err')}
  if(SYNC.pending.length)flush();
}
function softRender(){
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(['seance','classement'].includes(tab))render();else renderHead();
}
function startSync(room,etag,remote){
  SYNC.room=room;SYNC.etag=etag||null;SYNC.remote=remote?clone(remote):null;SYNC.ending=false;SYNC.status='ok';
  clearInterval(SYNC.timer);SYNC.timer=setInterval(poll,1500);
}
function stopSync(){clearInterval(SYNC.timer);clearTimeout(SYNC.retry);Object.assign(SYNC,{room:null,etag:null,remote:null,pending:[],busy:false,status:'off',ending:false})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
window.addEventListener('online',()=>{poll();flush()});
window.addEventListener('beforeunload',e=>{if(SYNC.pending.length){e.preventDefault();e.returnValue=''}});
/* points cumulés : ajoutés aux élèves de la classe quand la séance se termine */
function foldSession(sess){
  if(!sess||!sess.v2)return;
  if(S.classes.some(c=>c.id===sess.classId)){S.sessPts=S.sessPts||{};S.sessPts[sess.id]={classId:sess.classId,date:sess.created,pts:sessPtsOf(sess)}}
}
function handleEnded(){
  if(!S.session||!S.session.ended)return;
  foldSession(S.session);S.session=null;
  if(!SYNC.pending.length)stopSync();else SYNC.ending=true;
  save();toast('Séance terminée');
}
async function createRoom(){
  let room,r;
  for(let k=0;k<5;k++){room=genRoom();
    const codes=await apiPut(room,'codes',{cards:S.cards,settings:{...S.settings,pin:''}},{ifNew:true});if(codes.status===412)continue;
    S.session.room=room;r=await apiPut(room,'state',S.session,{ifNew:true});if(r.status!==412)break;}
  if(!r||r.status!==200)throw new Error('Impossible de créer la séance en ligne');
  startSync(room,r.etag,S.session);
  return room;
}
function joinScreen(){
  if(!canSync())return openModal(`<h2>Rejoindre une séance</h2><p>Le mode multi-tablettes fonctionne uniquement avec la version en ligne de l'appli (adresse netlify.app), avec internet.</p><div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
  openModal(`<h2>📡 Rejoindre une séance</h2><p class="sub">Tape le code affiché sur la tablette du prof.</p>
  <input type="text" id="roomin" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ex : K7M2Q" style="font-size:30px;font-weight:800;text-align:center;letter-spacing:6px;text-transform:uppercase" autofocus onkeydown="if(event.key==='Enter')joinRoom()">
  <div id="joinmsg" class="sub" style="margin-top:8px;min-height:20px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="joinRoom()">Rejoindre</button></div>`);
}
async function joinRoom(){
  const room=$('#roomin').value.trim().toUpperCase();if(!room)return;
  $('#joinmsg').textContent='Connexion…';
  try{
    const c=await apiGet(room,'codes');const st=await apiGet(room,'state');
    if(c.status===404||st.status===404){$('#joinmsg').textContent='❌ Aucune séance avec ce code.';return}
    if(st.data.ended){$('#joinmsg').textContent='Cette séance est terminée.';return}
    S.cards=c.data.cards||[];S.importInfo={file:'séance '+room,date:new Date().toLocaleDateString('fr-FR')};
    const pin=S.settings.pin;S.settings=Object.assign(defState().settings,c.data.settings||{},{pin});
    S.session=st.data;startSync(room,st.etag,st.data);save();closeModal();tab='seance';render();toast('Tablette connectée à la séance '+room);
  }catch(e){$('#joinmsg').textContent='❌ Connexion impossible : vérifie internet ('+e.message+').'}
}

/* ============ CLASSEMENT ============ */
function stats(){
  const s=S.session;const map={};
  if(s)s.groups.forEach(g=>g.hist.forEach(h=>h.members.forEach(id=>{const m=map[id]||(map[id]={pts:0,ok:0,n:0,max:0,wins:0});m.pts+=h.pts;m.n++;if(h.ok){m.ok++;m.max=Math.max(m.max,h.stars)}if(h.win)m.wins++})));
  return map;
}
function rClassement(){
  const s=S.session;const cls=curClass();
  const views=s?[['groupes','Équipes'],['eleves','Élèves (séance)'],...(cls?[['cumul','Élèves (cumul)']]:[])]:[['cumul','Élèves (cumul)']];
  if(!views.find(v=>v[0]===clsView))clsView=views[0][0];
  let rows=[],head='';
  const st=stats();
  if(clsView==='groupes'){
    head=`<tr><th>#</th><th>Équipe</th><th class="n">Pts</th><th class="n">Réussites</th>${s.mode==='defi'?'<th class="n">Victoires</th>':''}<th class="n">Niv. max</th></tr>`;
    rows=[...s.groups].sort((a,b)=>b.pts-a.pts).map(g=>({k:g.pts,html:`<td><b>${esc(g.name)}</b><div class="sub">${g.members.map(id=>esc(stu(id)?.name)).join(', ')}</div></td><td class="n"><b>${g.pts}</b></td><td class="n">${g.hist.filter(h=>h.ok).length}/${g.hist.length}</td>${s.mode==='defi'?`<td class="n">${g.wins||0}</td>`:''}<td class="n">${g.maxLevel?starsH(g.maxLevel):'–'}</td>`}));
  }else if(clsView==='eleves'){
    head=`<tr><th>#</th><th>Élève</th><th class="n">Pts</th><th class="n">Réussites</th><th class="n">Niv. max</th></tr>`;
    const ids=new Set([...s.groups.flatMap(g=>g.members),...Object.keys(st)]);
    rows=[...ids].map(id=>{const m=st[id]||{pts:0,ok:0,n:0,max:0};return{k:m.pts,html:`<td>${esc(stu(id)?.name||'?')}</td><td class="n"><b>${m.pts}</b></td><td class="n">${m.ok}/${m.n}</td><td class="n">${m.max?starsH(m.max):'–'}</td>`}}).sort((a,b)=>b.k-a.k);
  }else{
    if(!cls){$('#main').innerHTML='<div class="card empty">Aucune classe.</div>';return}
    head=`<tr><th>#</th><th>Élève</th><th class="n">Points cumulés</th></tr>`;
    rows=cls.students.map(x=>{const t=cumul(x);return{k:t,html:`<td>${esc(x.name)}</td><td class="n"><b>${t}</b></td>`}}).sort((a,b)=>b.k-a.k);
  }
  let rank=0,prev=null;
  const body=rows.map((r,i)=>{if(r.k!==prev){rank=i+1;prev=r.k}return`<tr class="p${rank}"><td class="rank">${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank}</td>${r.html}</tr>`}).join('');
  $('#main').innerHTML=`<div class="toolbar"><h2>🏆 Classement ${cls?'· '+esc(cls.name):''}</h2>
   <button class="btn sm" onclick="document.body.classList.toggle('fs')">⛶ Plein écran</button>
   ${P('<button class="btn sm" onclick="exportResults()">⬇ Excel</button>')}
   ${!document.body.classList.contains('fs')&&S.session?`<button class="btn sm" onclick="go('seance')">← Séance</button>`:''}</div>
   <div class="seg" style="margin-bottom:12px">${views.map(([k,l])=>`<button class="${clsView===k?'on':''}" style="text-align:center" onclick="clsView='${k}';rClassement()"><b>${l}</b></button>`).join('')}</div>
   <div class="card tablewrap" style="padding:6px 10px"><table>${head}${body||'<tr><td colspan="6" class="empty">Pas encore de résultat</td></tr>'}</table></div>
   <p class="sub" style="text-align:center">Astuce : en plein écran, touche 2 fois l'écran pour revenir.</p>`;
  document.body.ondblclick=()=>{if(document.body.classList.contains('fs')){document.body.classList.remove('fs');rClassement()}};
}
function exportResults(){
  const s=S.session;const cls=curClass();const st=stats();const sheets=[];
  if(!cls&&s)sheets.push({name:'Élèves',rows:[['Élève','Points séance','Réussites','Essais','Niveau max'],...Object.keys(s.roster||{}).map(id=>{const m=st[id]||{pts:0,ok:0,n:0,max:0};return[stu(id).name,m.pts,m.ok,m.n,m.max||'']}).sort((a,b)=>b[1]-a[1])]});
  if(cls)sheets.push({name:'Élèves',rows:[['Élève','Points séance','Réussites','Essais','Niveau max','Points cumulés'],...cls.students.map(x=>{const m=st[x.id]||{pts:0,ok:0,n:0,max:0};return[x.name,m.pts,m.ok,m.n,m.max||'',cumul(x)]}).sort((a,b)=>b[1]-a[1]||b[5]-a[5])]});
  if(s){
    sheets.push({name:'Équipes',rows:[['Équipe','Membres','Points','Réussites','Essais','Victoires défi'],...[...s.groups].sort((a,b)=>b.pts-a.pts).map(g=>[g.name,g.members.map(id=>stu(id)?.name).join(', '),g.pts,g.hist.filter(h=>h.ok).length,g.hist.length,g.wins||0])]});
    const H=[];s.groups.forEach(g=>g.hist.forEach(h=>H.push([new Date(h.ts).toLocaleTimeString('fr-FR'),g.name,h.carte,h.stars,h.ok?'Réussi':'Échec',h.pts,h.time!=null?fmtT(h.time):'',h.duel?(h.win?'Victoire':'Défi'):'',h.ts])));
    H.sort((a,b)=>a[8]-b[8]);sheets.push({name:'Historique',rows:[['Heure','Équipe','Carte','Étoiles','Résultat','Points','Temps','Défi'],...H.map(r=>r.slice(0,8))]});
  }
  if(!sheets.length)return toast('Rien à exporter');
  const d=new Date();writeWorkbook(sheets,`CO_${(cls?.name||s?.className||'classe').replace(/[^\w-]+/g,'_')}_${d.toISOString().slice(0,10)}.xlsx`);
}

/* ============ CLASSES ============ */
function rClasses(){

  <div class="card"><div class="toolbar"><h2 style="font-size:18px">${esc(cls.name)}</h2><button class="btn sm" onclick="renameClass()">Renommer</button><button class="btn sm" onclick="resetPts()">Points à 0</button><button class="btn sm danger" onclick="delClass()">Supprimer</button></div>
  <p class="sub">Les points cumulés se mettent à jour à chaque validation, y compris pendant une séance multi-tablettes.<br>Le <b>niveau</b> (1 = débutant … 6 = expert) sert à former des équipes homogènes ou hétérogènes et à fixer le niveau de départ « auto ».</p>
  <div class="tablewrap"><table><tr><th>Élève</th><th>Niveau</th><th class="n">Pts cumulés</th><th></th></tr>
  ${cls.students.map(s=>`<tr><td><input type="text" value="${esc(s.name)}" onchange="stu('${s.id}').name=this.value.trim()||'?';save()"></td>
    <td><select style="width:70px" onchange="stu('${s.id}').level=+this.value;save()">${[1,2,3,4,5,6].map(l=>`<option ${s.level===l?'selected':''}>${l}</option>`).join('')}</select></td>
    <td class="n"><input type="number" style="width:80px;text-align:right" value="${cumul(s)}" onchange="const x=stu('${s.id}');x.pts=(+this.value||0)-sessSum(x);save()"></td>
    <td><button class="btn sm ghost" onclick="curCls().students=curCls().students.filter(x=>x.id!=='${s.id}');save();rClasses()">🗑</button></td></tr>`).join('')}</table></div>
  <h3>Ajouter des élèves</h3><p class="sub">Un élève par ligne. Tu peux ajouter le niveau après un point-virgule : <i>Léa Martin;4</i></p>
  <textarea id="addst" placeholder="Léa Martin;4&#10;Tom Durand;2&#10;Inès Bernard"></textarea>
  <button class="btn primary" style="margin-top:8px" onclick="addStudents()">Ajouter</button></div>`;
  $('#main').innerHTML=h;
}
const curCls=()=>S.classes.find(c=>c.id===S.classId);
function resetPts(){const c=curCls();confirmBox('Remettre à zéro les points cumulés de '+esc(c.name)+' ?<br><small class="sub">Les points de la séance en cours (s\'il y en a une) seront recomptés à partir de maintenant.</small>',()=>{
  c.students.forEach(s=>s.pts=0);const all=S.sessPts||{};for(const k in all)if(all[k].classId===c.id)delete all[k];
  if(S.session&&S.session.classId===c.id){const m=sessPtsOf(S.session);c.students.forEach(s=>{s.pts=-(m[s.id]||0)})}
  save();rClasses()},'Remettre à zéro')}
function addClass(){window._ac=()=>{const n=$('#cn').value.trim();if(!n)return;const c={id:uid(),name:n,students:[]};S.classes.push(c);S.classId=c.id;save();closeModal();rClasses()};
  openModal(`<h2>Nouvelle classe</h2><input type="text" id="cn" placeholder="ex : 5e B" autofocus onkeydown="if(event.key==='Enter')_ac()"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="_ac()">Créer</button></div>`)}
function renameClass(){const c=curCls();window._rc=()=>{const n=$('#cn').value.trim();if(n){c.name=n;save()}closeModal();rClasses()};
  openModal(`<h2>Renommer</h2><input type="text" id="cn" value="${esc(c.name)}" autofocus onkeydown="if(event.key==='Enter')_rc()"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="_rc()">OK</button></div>`)}
function delClass(){const c=curCls();if(S.session&&S.session.classId===c.id)return toast('Classe utilisée par la séance en cours');confirmBox(`Supprimer la classe ${esc(c.name)} ?`,()=>{S.classes=S.classes.filter(x=>x!==c);S.classId=S.classes[0]?.id||null;save();rClasses()},'Supprimer')}
function addStudents(){
  const c=curCls();const lines=$('#addst').value.split(/\n/).map(l=>l.trim()).filter(Boolean);
  lines.forEach(l=>{const p=l.split(/[;\t]/);const lv=parseInt(p[1]);c.students.push({id:uid(),name:p[0].trim(),level:lv>=1&&lv<=6?lv:3,pts:0})});
  save();rClasses();toast(lines.length+' élève(s) ajouté(s)');
}
function importClasses(){
  pickFile('.xlsx,.xlsm,.csv',async f=>{
    try{
      const sheets=await readWorkbook(f);const found={};
      for(const sh of sheets){
        const rows=sh.rows.filter(r=>r&&r.some(v=>v!=null&&v!==''));if(!rows.length)continue;
        let h=rows.findIndex(r=>r.some(v=>/^(nom|prenom|eleve|eleves|nom prenom|nom et prenom|nom complet)$/.test(norm(v))));
        let iN=-1,iP=-1,iL=-1,iK=-1,data;
        if(h>=0){const hd=rows[h].map(norm);iN=hd.findIndex(v=>/^nom|eleve/.test(v));iP=hd.findIndex(v=>/^prenom/.test(v));if(iN===iP)iN=-1;iL=hd.findIndex(v=>/niveau|niv/.test(v));iK=hd.findIndex(v=>/classe/.test(v));data=rows.slice(h+1)}
        else{iN=0;data=rows;if(typeof rows[0][1]==='number')iL=1;else if(typeof rows[0][1]==='string')iP=1}
        for(const r of data){
          const name=[iP>=0?r[iP]:null,iN>=0?r[iN]:null].filter(v=>v!=null&&v!=='').join(' ').trim();if(!name)continue;
          const k=iK>=0&&r[iK]?String(r[iK]).trim():sh.name;const lv=iL>=0?parseInt(r[iL]):NaN;
          (found[k]=found[k]||[]).push({name,level:lv>=1&&lv<=6?lv:3});
        }
      }
      const ks=Object.keys(found);if(!ks.length)return toast('Aucun élève trouvé');
      ks.forEach(k=>{let c=S.classes.find(x=>norm(x.name)===norm(k));if(!c){c={id:uid(),name:k,students:[]};S.classes.push(c)}
        found[k].forEach(s=>{if(!c.students.some(x=>norm(x.name)===norm(s.name)))c.students.push({id:uid(),name:s.name,level:s.level,pts:0})});S.classId=c.id});
      save();rClasses();toast(`${ks.length} classe(s) importée(s)`);
    }catch(e){console.error(e);toast('Erreur de lecture : '+e.message)}
  });
}

/* ============ CODES ============ */
function rCodes(){
  let list=S.cards.filter(c=>!codeFilter.q||String(c.carte)===codeFilter.q.trim())
    .sort((a,b)=>(parseFloat(a.carte)-parseFloat(b.carte))||String(a.carte).localeCompare(String(b.carte)));
  $('#main').innerHTML=`<div class="toolbar"><h2>🔑 Codes des cartes</h2><button class="btn sm primary" onclick="importCodes()">📥 Importer Excel</button><button class="btn sm" onclick="downloadTemplate()">⬇ Modèle Excel</button>${S.cards.length?`<button class="btn sm danger" onclick="confirmBox('Effacer tous les codes ?',()=>{S.cards=[];S.importInfo=null;save();rCodes()},'Effacer')">Effacer</button>`:''}</div>
  <div class="info"><b>Format du fichier :</b> une seule ligne par carte. Colonnes : <b>Carte</b> · <b>Départ</b> (lettre) · <b>Code 1 … Code 6</b> (nombres 00-99) · <b>Arrivée</b> (lettre).<br>
  Chaque carte existe en version ★ à ★★★★★★ avec les <b>mêmes réponses</b> : l'appli s'en sert à tous les niveaux et ne redonne jamais à une équipe un numéro de carte déjà fait. Les colonnes « Balise… » sont aussi reconnues ; les lettres sont facultatives.</div>
  ${S.cards.length?`<div class="card"><p class="sub" style="margin:0">${S.cards.length} cartes, chacune utilisable de ★ à ★★★★★★${S.importInfo?` · importé depuis <b>${esc(S.importInfo.file)}</b> le ${esc(S.importInfo.date)}`:''}</p></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><input type="text" placeholder="N° de carte" value="${esc(codeFilter.q)}" style="max-width:150px" onchange="codeFilter.q=this.value;rCodes()">
<span class="sub">${list.length} ligne(s)</span></div>
   <div class="tablewrap"><table><tr><th>Carte</th><th>Départ</th><th>Code</th><th>Arrivée</th></tr>
   ${list.slice(0,300).map(c=>`<tr><td><b>${esc(c.carte)}</b></td><td>${esc(c.dep)}</td><td style="font-family:ui-monospace,monospace;letter-spacing:1px">${c.code.map(v=>typeof v==='number'?String(v).padStart(2,'0'):esc(v)).join(' ')}</td><td>${esc(c.arr)}</td></tr>`).join('')}</table>${list.length>300?'<p class="sub">300 premières lignes affichées — filtre pour voir le reste.</p>':''}</div></div>`
  :`<div class="card empty"><p>Aucun code importé.</p><button class="btn primary" onclick="importCodes()">📥 Importer mon fichier Excel</button></div>`}`;
}

/* ============ RÉGLAGES ============ */
function rReglages(){
  const st=S.settings;
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,t,d])=>`<button class="${String(st[k])===String(v)?'on':''}" onclick="S.settings.${k}=${typeof v==='string'?`'${v}'`:v};save();rReglages()"><b>${t}</b>${d?`<small>${d}</small>`:''}</button>`).join('')}</div>`;
  $('#main').innerHTML=`<h2>⚙️ Réglages</h2>
  <div class="card"><div class="field"><label>Points par réussite (progression et niveau libre)</label>${seg('ptsMode',[['stars','= nombre d\'étoiles','★★★ = 3 pts'],['one','1 point par réussite','quel que soit le niveau']])}</div>
  <div class="field"><label>En cas de code faux, l'élève voit…</label>${seg('showErrors',[['none','Seulement « code faux »',''],['count','Le nombre d\'erreurs','ex : 2 erreurs'],['which','Les balises fausses','ex : balise n°3']])}</div></div>
  <div class="card"><h3 style="margin-top:0">⚔️ Défis</h3>
  <div class="field"><label>Bonus pour le vainqueur de la manche</label><div class="row"><span>étoiles +</span><input type="number" min="0" max="20" value="${st.defiBonus}" style="max-width:90px" onchange="S.settings.defiBonus=+this.value||0;save()"><span class="sub">points</span></div></div>
  <div class="field"><label>Le perdant avec un code juste marque…</label>${seg('defiLosePts',[[true,'Les points des étoiles','récompense la réussite'],[false,'0 point','seul le vainqueur marque']])}</div></div>
  <div class="card"><h3 style="margin-top:0">👥 Formation des équipes</h3>${seg('levelSource',[['prof','Niveau donné par le prof','1 à 6, dans l\'onglet Classes'],['points','Points cumulés','classement des séances précédentes']])}</div>
  <div class="card"><h3 style="margin-top:0">🔒 Mot de passe prof</h3><p class="sub">Demandé pour ouvrir l'espace prof (séances, classes, codes, réglages). Par défaut : 2335.</p>
  <div class="row"><input type="password" inputmode="numeric" id="pinset" placeholder="Nouveau mot de passe" style="max-width:200px"><button class="btn primary" onclick="const v=$('#pinset').value.trim();if(!v)return toast('Mot de passe vide');S.settings.pin=v;save();render();toast('Mot de passe enregistré')">Changer</button></div></div>
  <div class="card"><h3 style="margin-top:0">💾 Sauvegarde</h3><p class="sub">Tout est enregistré dans ce navigateur. Exporte une sauvegarde pour changer d'appareil.</p>
  <div class="row"><button class="btn" onclick="backup()">⬇ Exporter la sauvegarde</button><button class="btn" onclick="restore()">⬆ Restaurer</button><button class="btn danger" onclick="confirmBox('Tout effacer (codes, classes, séance) ?',()=>{S=defState();save();tab='codes';render()},'Tout effacer')">Tout effacer</button></div></div>`;
}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sauvegarde_course_orientation_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(){pickFile('.json',async f=>{try{const d=JSON.parse(await f.text());if(!d.cards)throw 0;S=Object.assign(defState(),d);save();render();toast('Sauvegarde restaurée')}catch(e){toast('Fichier invalide')}})}

/* ============ chrono ============ */
function tick(){document.querySelectorAll('.timer[data-t0]').forEach(e=>e.textContent='⏱ '+fmtT(Date.now()-+e.dataset.t0))}
setInterval(tick,1000);
if(S.session&&S.session.room&&canSync()){startSync(S.session.room);poll()}
render();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
